{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1 class="h3 mb-3">My Profile</h1>
<div class="row g-4">
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h2 class="h5">Account details</h2>
    <form method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="details">
      <div class="text-center mb-3">
        {% if current_user.photo %}<img class="avatar-lg" src="{{ url_for('static', filename='uploads/' ~ current_user.photo) }}" alt="photo">
        {% else %}<img class="avatar-lg" src="{{ url_for('static', filename='img/logo.png') }}" alt="photo">{% endif %}
      </div>
      <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ current_user.name }}" required></div>
      <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ current_user.email }}" required></div>
      <div class="mb-3"><label class="form-label">Profile photo</label><input class="form-control" type="file" name="photo" accept="image/*"></div>
      <button class="btn btn-brand">Save changes</button>
    </form>
  </div></div></div>
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h2 class="h5">Change password</h2>
    <form method="post" class="needs-validation" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="action" value="password">
      <div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="current" required></div>
      <div class="mb-3"><label class="form-label">New password</label><input class="form-control" type="password" name="new_password" minlength="8" required></div>
      <div class="mb-3"><label class="form-label">Confirm new password</label><input class="form-control" type="password" name="confirm" required></div>
      <button class="btn btn-brand">Update password</button>
    </form>
  </div></div></div>
</div>
{% endblock %}
