{% extends "base.html" %}
{% block body_class %}auth-bg{% endblock %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm"><div class="card-body p-4">
  <h1 class="h4 mb-3">Set up owner account</h1>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Full name</label>
      <input class="form-control" name="name" required></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" required></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" minlength="8" required>
      <div class="invalid-feedback">At least 8 characters.</div></div>
    <div class="mb-3"><label class="form-label">Confirm password</label>
      <input class="form-control" type="password" name="confirm" required>
      <div class="invalid-feedback">Passwords must match.</div></div>
    <button class="btn btn-brand w-100">Register</button>
  </form>
</div></div>
{% endblock %}
