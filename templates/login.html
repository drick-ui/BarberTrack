{% extends "base.html" %}
{% block body_class %}auth-bg{% endblock %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card auth-card shadow-sm"><div class="card-body p-4">
  <h1 class="h4 mb-3">Owner Login</h1>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" required></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-brand w-100">Login</button>
  </form>
  {% if registration_open %}<p class="mt-3 mb-0 text-center">No account yet? <a href="{{ url_for('register') }}">Set up owner</a></p>{% endif %}
</div></div>
{% endblock %}
