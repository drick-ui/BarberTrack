{% extends "base.html" %}
{% block body_class %}auth-bg{% endblock %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body p-4 p-md-5">
  <img class="auth-logo" src="{{ url_for('static', filename='img/logo.png') }}" alt="BarberTrack logo">
  <h1 class="h4 auth-title font-display">Owner Login</h1>
  <p class="auth-sub">Sign in to manage your barbershop.</p>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input class="form-control" id="email" type="email" name="email" autocomplete="username" required></div></div>
    <div class="mb-4"><label class="form-label" for="login-password">Password</label>
      <div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input class="form-control" id="login-password" type="password" name="password" autocomplete="current-password" required>
        <button class="btn btn-outline-secondary" type="button" data-toggle-password="#login-password" aria-label="Show or hide password"><i class="bi bi-eye"></i></button></div></div>
    <button class="btn btn-brand w-100 py-2">Login</button>
  </form>
  {% if registration_open %}<p class="mt-3 mb-0 text-center">No account yet? <a href="{{ url_for('register') }}">Set up owner</a></p>{% endif %}
</div></div>
{% endblock %}
